name: Apply 2.3.6 focus-context fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply_236_focus_context.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 2.3.6 patch
        run: python tools/PATCH_236_FOCUS_CONTEXT.py

      - name: Validate
        run: |
          node --check background.js
          node --check windowed_fullscreen.js
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          assert m['version']=='2.3.6', m['version']
          bg=Path('background.js').read_text(encoding='utf-8')
          assert 'inputSource === "command"' in bg
          assert 'preferredWindow.focused !== true' in bg
          assert 'getFocusedContext(preferredWindowId, preferredTabId, inputSource)' in bg
          assert 'isCrossInputDuplicate' in bg
          print('VALIDATE_236_FOCUS_CONTEXT_OK')
          PY

      - name: Commit 2.3.6
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add background.js manifest.json
          git commit -m 'Release 2.3.6 restore popup Alt+C transitions'
          git push origin main
