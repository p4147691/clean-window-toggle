name: Apply 2.3.7 origin-focus fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply_237_origin_focus.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 2.3.7 patch
        run: python tools/PATCH_237_ORIGIN_FOCUS.py

      - name: Validate
        run: |
          node --check background.js
          node --check windowed_fullscreen.js
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          assert m['version']=='2.3.7', m['version']
          bg=Path('background.js').read_text(encoding='utf-8')
          assert 'originWindow.focused !== true' in bg
          assert 'originTab.active !== true' in bg
          assert 'getFocusedContext(preferredWindowId, preferredTabId);' in bg
          assert 'isCrossInputDuplicate' not in bg
          assert 'CROSS_INPUT_DEDUPE_MS' not in bg
          assert 'lastToggleInput' not in bg
          assert 'else if (session.mode === "clean")' in bg
          assert 'enterWindowedFullscreen(tab, window, session, sessions)' in bg
          print('VALIDATE_237_ORIGIN_FOCUS_OK')
          PY

      - name: Commit 2.3.7
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add background.js manifest.json
          git commit -m 'Release 2.3.7 bind Alt+C to origin window'
          git push origin main
