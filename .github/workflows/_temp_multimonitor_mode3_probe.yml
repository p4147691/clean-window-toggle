name: TEMP Multi-monitor Mode3 Return Probe

on:
  push:
    paths:
      - '.github/workflows/_temp_multimonitor_mode3_probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run cross-monitor and concurrent-session logical isolation probes
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Get-Content '.\tests\background-cycle-regression.test.js' -Raw -Encoding UTF8
          $extra = @'

          test('Mode 3 popup moved to another monitor must not alter unrelated Chrome windows', async () => {
            const r = await runtime('https://example.org/video');
            Object.assign(r.windows.get(20), { desktop: 'A', left: 1920, top: 0, width: 1000, height: 760, state: 'normal', focused: false });
            r.windows.set(40, { id: 40, desktop: 'A', focused: false, type: 'normal', state: 'normal', left: 2050, top: 120, width: 920, height: 720 });
            r.tabs.set(400, { id: 400, windowId: 40, active: true, index: 0, groupId: -1, pinned: false, url: 'https://example.net/other' });
            const before20 = structuredClone(r.windows.get(20));
            const before40 = structuredClone(r.windows.get(40));
            r.focus(10); await r.command(); await r.command();
            const popupId = r.popupId;
            Object.assign(r.windows.get(popupId), { left: 2300, top: 80, width: 1050, height: 700 });
            r.focus(popupId); await r.command();
            assert.equal(r.tabs.get(100).windowId, 10);
            assert.equal(r.windows.has(20), true); assert.equal(r.tabs.get(200).windowId, 20); assert.deepEqual(r.windows.get(20), before20);
            assert.equal(r.windows.has(40), true); assert.equal(r.tabs.get(400).windowId, 40); assert.deepEqual(r.windows.get(40), before40);
            assert.deepEqual(r.sessions, {});
          });

          test('returning one moved Mode 3 session must leave another independent Mode 3 session alive', async () => {
            const r = await runtime('https://example.org/video');
            Object.assign(r.windows.get(10), { desktop: 'A', left: 100, top: 80, width: 1000, height: 760 });
            Object.assign(r.windows.get(20), { desktop: 'A', left: 2050, top: 100, width: 1000, height: 760 });
            r.focus(20); await r.command(r.tabs.get(200)); const popupB = r.tabs.get(200).windowId; await r.command(r.tabs.get(200));
            const beforeB = structuredClone(r.windows.get(popupB));
            r.focus(10); await r.command(r.tabs.get(100)); const popupA = r.tabs.get(100).windowId; await r.command(r.tabs.get(100));
            Object.assign(r.windows.get(popupA), { left: 2250, top: 60, width: 980, height: 720 }); r.focus(popupA);
            await r.command(r.tabs.get(100));
            assert.equal(r.tabs.get(100).windowId, 10);
            assert.equal(r.windows.has(popupB), true); assert.equal(r.tabs.get(200).windowId, popupB); assert.equal(r.sessions[popupB].mode, 'windowed-fullscreen');
            const afterB = r.windows.get(popupB); for (const key of ['type','state','left','top','width','height']) assert.equal(afterB[key], beforeB[key]);
            r.focus(popupB); await r.command(r.tabs.get(200)); assert.equal(r.tabs.get(200).windowId, 20); assert.deepEqual(r.sessions, {});
          });

          test('a source with an existing Mode 3 session must refocus that popup instead of creating a competing session', async () => {
            const r = await runtime('https://example.org/video');
            r.tabs.set(101, { ...r.tabs.get(100), id: 101, active: false, index: 1, url: 'https://example.org/video2' });
            r.focus(10); await r.command(r.tabs.get(100)); const popupA = r.tabs.get(100).windowId; await r.command(r.tabs.get(100));
            assert.equal(r.sessions[popupA].sourceWindowId, 10);

            // Restore the source and try Alt+C on its remaining tab while A is still parked.
            // Product contract is one Clean Window session per source window.
            r.windows.get(10).state = 'normal'; r.tabs.get(101).active = true; r.focus(10);
            const windowCountBefore = r.windows.size;
            await r.command(r.tabs.get(101));

            assert.equal(r.windows.size, windowCountBefore, 'must not create or destroy another window');
            assert.equal(r.windows.get(popupA).focused, true, 'existing popup must be refocused');
            assert.equal(r.tabs.get(101).windowId, 10, 'remaining source tab must stay in source');
            assert.equal(Object.keys(r.sessions).length, 1, 'must keep exactly one session for the source');
            assert.equal(r.sessions[popupA].mode, 'windowed-fullscreen');
          });
          '@
          $probe = Join-Path $env:RUNNER_TEMP 'clean-window-multimonitor-probe.test.js'
          Set-Content -LiteralPath $probe -Value ($base + $extra) -Encoding UTF8
          node --test $probe
          if ($LASTEXITCODE -ne 0) { throw 'Multi-monitor Mode 3 logical probe failed.' }
