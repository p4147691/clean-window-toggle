name: Validate Clean Window 2.3.4 video-only stage 3

on:
  push:
    branches:
      - fix/video-only-windowed-fullscreen-234
    paths:
      - '.github/workflows/validate_video_only_234.yml'
      - '.github/trigger-234.txt'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/video-only-windowed-fullscreen-234
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch 2.3.4 video-only stage 3
        shell: python
        run: |
          from pathlib import Path
          import json

          p = Path('windowed_fullscreen.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const PAGE_FULLSCREEN_ATTRIBUTE = "data-clean-window-page-fullscreen";\n', '')
          s = s.replace('let fullscreenTargetKind = null;\n', '')
          pseudo = '''\n    html[${ROOT_ATTRIBUTE}]::after {\n      content: "" !important;\n      position: fixed !important;\n      inset: 0 !important;\n      box-sizing: border-box !important;\n      border: 2px solid #d9b84f !important;\n      box-shadow: inset 0 0 4px rgba(217, 184, 79, 0.32) !important;\n      pointer-events: none !important;\n      z-index: 2147483647 !important;\n    }\n'''
          s = s.replace(pseudo, '\n')
          s = s.replace('html[${ROOT_ATTRIBUTE}]:not([${PAGE_FULLSCREEN_ATTRIBUTE}])', 'html[${ROOT_ATTRIBUTE}]')

          start = s.index('function findFullscreenTarget() {')
          end = s.index('\nchrome.runtime.onMessage.addListener', start)
          replacement = r'''function findFullscreenTarget() {
  const youtubePlayer = document.querySelector("#movie_player.html5-video-player, #movie_player");
  if (youtubePlayer && visibleArea(youtubePlayer) > 0) return youtubePlayer;

  const videos = [...document.querySelectorAll("video")]
    .map((video) => ({ video, area: visibleArea(video) }))
    .filter((item) => item.area > 0)
    .sort((a, b) => b.area - a.area);
  return videos[0]?.video || null;
}

function dispatchFullscreenResize() {
  window.dispatchEvent(new Event("resize"));
  requestAnimationFrame(() => window.dispatchEvent(new Event("resize")));
  setTimeout(() => window.dispatchEvent(new Event("resize")), 80);
}

function applyFullscreenTarget(target, preserveScroll = false) {
  if (!target) return false;
  fullscreenTarget?.removeAttribute(TARGET_ATTRIBUTE);
  fullscreenTarget = target;
  document.documentElement.setAttribute(ROOT_ATTRIBUTE, "");
  fullscreenTarget.setAttribute(TARGET_ATTRIBUTE, "");
  renderGoldBorder(true);
  if (!preserveScroll) window.scrollTo(0, 0);
  dispatchFullscreenResize();
  return true;
}

function notifyVideoGone() {
  chrome.runtime.sendMessage({ type: "windowed-fullscreen-video-gone" }, () => {
    void chrome.runtime.lastError;
  });
}

function refreshWindowedFullscreenTarget() {
  if (!document.documentElement.hasAttribute(ROOT_ATTRIBUTE)) return;
  const target = findFullscreenTarget();
  if (!target) {
    clearWindowedFullscreenVisuals(true);
    notifyVideoGone();
    return;
  }
  if (fullscreenTarget === target && fullscreenTarget?.isConnected !== false) return;
  applyFullscreenTarget(target, true);
}

function scheduleFullscreenRepair(delay = 80) {
  if (!document.documentElement.hasAttribute(ROOT_ATTRIBUTE)) return;
  if (fullscreenRepairTimer) clearTimeout(fullscreenRepairTimer);
  fullscreenRepairTimer = setTimeout(() => {
    fullscreenRepairTimer = null;
    refreshWindowedFullscreenTarget();
  }, delay);
}

function startFullscreenRepairWatch() {
  if (fullscreenObserver) return;
  fullscreenObserver = new MutationObserver(() => scheduleFullscreenRepair(90));
  fullscreenObserver.observe(document.documentElement, { childList: true, subtree: true });
}

function stopFullscreenRepairWatch() {
  fullscreenObserver?.disconnect();
  fullscreenObserver = null;
  if (fullscreenRepairTimer) clearTimeout(fullscreenRepairTimer);
  fullscreenRepairTimer = null;
}

function clearWindowedFullscreenVisuals(restoreScroll = true) {
  stopFullscreenRepairWatch();
  renderGoldBorder(false);
  document.documentElement.removeAttribute(ROOT_ATTRIBUTE);
  document.documentElement.removeAttribute("data-clean-window-page-fullscreen");
  fullscreenTarget?.removeAttribute(TARGET_ATTRIBUTE);
  for (const element of document.querySelectorAll(`[${TARGET_ATTRIBUTE}]`)) {
    element.removeAttribute(TARGET_ATTRIBUTE);
  }
  fullscreenTarget = null;
  if (restoreScroll) window.scrollTo(savedScrollX, savedScrollY);
  dispatchFullscreenResize();
}

function setWindowedFullscreen(enabled) {
  if (!enabled) {
    clearWindowedFullscreenVisuals(true);
    return { ok: true };
  }
  const target = findFullscreenTarget();
  if (!target) {
    clearWindowedFullscreenVisuals(false);
    return { ok: false, reason: "no-video", error: "이 페이지에는 확대할 영상이 없습니다." };
  }
  installStyles();
  if (!document.documentElement.hasAttribute(ROOT_ATTRIBUTE)) {
    savedScrollX = window.scrollX;
    savedScrollY = window.scrollY;
  }
  applyFullscreenTarget(target, false);
  startFullscreenRepairWatch();
  return { ok: true };
}

document.addEventListener("yt-navigate-finish", () => scheduleFullscreenRepair(40), true);
window.addEventListener("popstate", () => scheduleFullscreenRepair(40), true);
window.addEventListener("hashchange", () => scheduleFullscreenRepair(40), true);
window.addEventListener("pageshow", () => scheduleFullscreenRepair(40), true);
'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')

          b = Path('background.js')
          bg = b.read_text(encoding='utf-8')
          old = '''async function enterWindowedFullscreen(tab, popup, session, sessions) {\n  const content = await sendFullscreenMessage(tab.id, true);\n  const frame = await nativeWindowRequest("hideCleanWindowFrame");\n  session.mode = "windowed-fullscreen";\n  session.contentFullscreen = Boolean(content?.ok);\n  session.frameHidden = Boolean(frame?.ok);\n  sessions[String(popup.id)] = session;\n  await saveSessions(sessions);\n  await publishSessionState(popup.id, session);\n}\n'''
          new = '''async function enterWindowedFullscreen(tab, popup, session, sessions) {\n  const content = await sendFullscreenMessage(tab.id, true);\n  if (!content?.ok) return false;\n  session.mode = "windowed-fullscreen";\n  session.contentFullscreen = true;\n  session.frameHidden = false;\n  sessions[String(popup.id)] = session;\n  await saveSessions(sessions);\n  await publishSessionState(popup.id, session);\n  return true;\n}\n\nasync function downgradeWindowedFullscreenToClean(popupId, session, sessions) {\n  if (!session || session.mode !== "windowed-fullscreen") return;\n  await nativeWindowRequest("restoreCleanWindowFrame").catch(() => {});\n  session.mode = "clean";\n  session.contentFullscreen = false;\n  session.frameHidden = false;\n  sessions[String(popupId)] = session;\n  await saveSessions(sessions);\n  await publishSessionState(popupId, session).catch(() => {});\n}\n'''
          if old not in bg: raise SystemExit('enterWindowedFullscreen block not found')
          bg = bg.replace(old, new)

          old = '    else if (session.mode === "clean") await enterWindowedFullscreen(tab, window, session, sessions);\n    else await returnToNormalWindow(tab, window, session, sessions);'
          new = '    else if (session.mode === "clean") {\n      const entered = await enterWindowedFullscreen(tab, window, session, sessions);\n      if (!entered) await returnToNormalWindow(tab, window, session, sessions);\n    }\n    else await returnToNormalWindow(tab, window, session, sessions);'
          if old not in bg: raise SystemExit('toggle clean block not found')
          bg = bg.replace(old, new)

          old = '''    if (session.mode === "windowed-fullscreen") {\n      await sendFullscreenMessage(targetTabId, true);\n      await nativeWindowRequest("hideCleanWindowFrame");\n    }\n    await publishSessionState(newPopup.id, session);'''
          new = '''    if (session.mode === "windowed-fullscreen") {\n      const content = await sendFullscreenMessage(targetTabId, true);\n      if (!content?.ok) {\n        session.mode = "clean";\n        session.contentFullscreen = false;\n        session.frameHidden = false;\n        await nativeWindowRequest("restoreCleanWindowFrame").catch(() => {});\n        sessions[String(newPopup.id)] = session;\n        await saveSessions(sessions);\n      }\n    }\n    await publishSessionState(newPopup.id, session);'''
          if old not in bg: raise SystemExit('switch fullscreen block not found')
          bg = bg.replace(old, new)

          needle = '''  if (message?.type === "return-clean-window-normal-request") {'''
          insert = '''  if (message?.type === "windowed-fullscreen-video-gone") {\n    const popupId = sender.tab?.windowId;\n    if (Number.isInteger(popupId)) {\n      getSessions().then(async (sessions) => {\n        const session = sessions[String(popupId)];\n        if (session?.mode === "windowed-fullscreen") {\n          await downgradeWindowedFullscreenToClean(popupId, session, sessions);\n        }\n      }).catch(console.error);\n    }\n    return false;\n  }\n'''
          if needle not in bg: raise SystemExit('runtime message insertion point not found')
          bg = bg.replace(needle, insert + needle)
          b.write_text(bg, encoding='utf-8')

          m = Path('manifest.json')
          data = json.loads(m.read_text(encoding='utf-8'))
          data['version'] = '2.3.4'
          m.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

      - name: Validate
        run: |
          node --check background.js
          node --check windowed_fullscreen.js
          node --check fullscreen_guard.js
          node -e "const m=require('./manifest.json'); if(m.version!=='2.3.4') process.exit(1)"
          grep -q 'reason: "no-video"' windowed_fullscreen.js
          grep -q 'windowed-fullscreen-video-gone' windowed_fullscreen.js
          grep -q 'windowed-fullscreen-video-gone' background.js
          grep -q 'downgradeWindowedFullscreenToClean' background.js
          ! grep -q 'PAGE_FULLSCREEN_ATTRIBUTE' windowed_fullscreen.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add background.js windowed_fullscreen.js manifest.json
          git commit -m 'Make stage 3 video-only and simplify cleanup'
          git push origin HEAD:fix/video-only-windowed-fullscreen-234
