name: Bump Clean Window Runtime 2.3.10

on:
  push:
    branches:
      - fix/runtime-version-2.3.10-20260903
    paths:
      - '.github/workflows/bump_runtime_2310.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-version-2.3.10-20260903
      - name: Bump runtime version
        run: python .github/bump_runtime_2310.py
      - name: Validate
        run: |
          python -m json.tool manifest.json > /dev/null
          node --check windowed_fullscreen.js
          git diff --check
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json windowed_fullscreen.js
          git commit -m "Bump Clean Window runtime to 2.3.10"
          git push origin HEAD:fix/runtime-version-2.3.10-20260903
