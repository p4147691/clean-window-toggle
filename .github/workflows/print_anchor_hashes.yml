name: Print anchor experiment hashes

on:
  push:
    branches:
      - experiment/anchor-window-preservation
    paths:
      - '.github/workflows/print_anchor_hashes.yml'

jobs:
  hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sha256sum manifest.json background.js fullscreen_guard.js windowed_fullscreen.js
