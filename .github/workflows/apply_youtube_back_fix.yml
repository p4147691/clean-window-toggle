name: Apply YouTube Back Clean Race Fix

on:
  push:
    branches:
      - fix/youtube-back-clean-race-20260903
    paths:
      - '.github/workflows/apply_youtube_back_fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/youtube-back-clean-race-20260903
      - name: Apply minimal race fix
        run: python .github/apply_youtube_back_fix.py
      - name: Syntax check
        run: |
          node --check background.js
          node --check windowed_fullscreen.js
          node --check fullscreen_guard.js
          git diff --check
      - name: Commit branch result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add background.js windowed_fullscreen.js
          git commit -m "Fix YouTube back navigation fullscreen race"
          git push origin HEAD:fix/youtube-back-clean-race-20260903
