name: Apply 2.3.18 transition guard

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply_2_3_18_transition_guard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/apply_2_3_18_transition_guard.py
      - name: Validate
        run: |
          node --check background.js
          node --check windowed_fullscreen.js
          node --check fullscreen_guard.js
          git diff --check
      - name: Commit product files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add background.js windowed_fullscreen.js manifest.json
          git commit -m 'Release 2.3.18 guard transition lock'
          git push origin HEAD:main
