name: Apply 2.3.9 hot runtime architecture

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply_239_hot_runtime.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 2.3.9 patch
        run: python tools/PATCH_239_HOT_RUNTIME.py

      - name: Validate
        run: |
          node --check background.js
          node --check windowed_fullscreen.js
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          assert m['version']=='2.3.9', m['version']
          bg=Path('background.js').read_text(encoding='utf-8')
          wf=Path('windowed_fullscreen.js').read_text(encoding='utf-8')
          assert 'ensureContentRuntimeCurrent' in bg
          assert 'clean-window-runtime-probe' in bg
          assert 'details.reason !== "update"' in bg
          assert 'const RUNTIME_VERSION = "2.3.9"' in wf
          assert 'previousRuntime.dispose()' in wf
          assert 'new AbortController()' in wf
          assert 'clean-window-runtime-probe' in wf
          assert 'MESSAGE_BRIDGE_KEY' in wf
          assert 'snapshotRuntimeState' in wf
          assert wf.strip().endswith('})();')
          assert 'originWindow.focused !== true' in bg
          print('VALIDATE_239_HOT_RUNTIME_OK')
          PY

      - name: Commit 2.3.9
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add background.js windowed_fullscreen.js manifest.json
          git commit -m 'Release 2.3.9 add safe hot runtime updates'
          git push origin main
