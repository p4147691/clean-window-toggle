name: Release Clean Window 2.3.0 anchor preservation

on:
  push:
    branches:
      - main
    paths:
      - 'tools/APPLY_ANCHOR_RELEASE_230.py'
      - '.github/workflows/release_anchor_230.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply release patch
        run: python tools/APPLY_ANCHOR_RELEASE_230.py

      - name: Validate JavaScript and release invariants
        run: |
          node --check background.js
          node -e "const m=require('./manifest.json'); if(m.version!=='2.3.0') throw new Error('version'); if(!m.description.includes('원래 Chrome 창 정체성')) throw new Error('description')"
          python - <<'PY'
          from pathlib import Path
          t = Path('background.js').read_text(encoding='utf-8')
          checks = {
              'single-tab-only anchor': 'sourceTabs.length !== 1' in t,
              'anchor created before popup': t.index('createSourceAnchorIfNeeded(source, sourceTabs)') < t.index('popup = await chrome.windows.create({'),
              'anchor stored': 'anchorTabId: anchorTab?.id ?? null' in t,
              'anchor hidden from shell': '.filter((tab) => tab.id !== session.anchorTabId)' in t,
              'return verifies real tab before anchor removal': 'removeSourceAnchorAfterReturn(session.anchorTabId, source.id, tab.id)' in t,
              'multi-tab source still parked normally': 'await chrome.windows.update(session.sourceWindowId, { state: "minimized" })' in t,
              'fallback new normal window retained': 'const normal = await chrome.windows.create({' in t,
              'popup X removes single-tab anchor': 'removeSourceAnchor(closedPopupSession.anchorTabId)' in t,
              'recovery removes orphan single-tab anchor': 'removeSourceAnchor(session.anchorTabId)' in t,
              'no direct-return experiment': 'movePopupTabBack(tab.id, source.id' in t,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Missing invariants: ' + ', '.join(failed))
          print('Clean Window 2.3.0 anchor invariants OK')
          PY
          git diff --check

      - name: Commit validated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add background.js manifest.json README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Release 2.3.0 source-window anchor preservation"
          git push origin HEAD:main
