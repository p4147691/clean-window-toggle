name: Verify existing 2.3.4 code

on:
  push:
    branches:
      - fix/video-only-windowed-fullscreen-234
    paths:
      - '.github/workflows/verify_234_existing.yml'
      - '.github/trigger-verify-234.txt'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/video-only-windowed-fullscreen-234
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check background.js
      - run: node --check windowed_fullscreen.js
      - run: node --check fullscreen_guard.js
      - run: node -e "const m=require('./manifest.json'); if(m.version!=='2.3.4') process.exit(1)"
      - run: "grep -q 'no-video' windowed_fullscreen.js"
      - run: "grep -q 'windowed-fullscreen-video-gone' background.js"
      - run: "grep -q 'downgradeWindowedFullscreenToClean' background.js"
