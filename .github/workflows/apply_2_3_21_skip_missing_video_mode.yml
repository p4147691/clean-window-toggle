name: Apply 2.3.21 missing-video cycle fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply_2_3_21_skip_missing_video_mode.yml'
      - '.github/apply_2_3_21_skip_missing_video_mode.py'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/apply_2_3_21_skip_missing_video_mode.py
      - name: Validate
        run: |
          node --check background.js
          node --check windowed_fullscreen.js
          python - <<'PY'
          import json
          m=json.load(open('manifest.json', encoding='utf-8'))
          assert m['version']=='2.3.21'
          t=open('background.js', encoding='utf-8').read()
          assert 'clean-skip-missing-video-to-normal' in t
          assert 'reason: content?.reason || null' in t
          assert 'entered?.reason === "no-video"' in t
          print('VALIDATE_2_3_21_OK')
          PY
      - name: Commit release
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add background.js manifest.json windowed_fullscreen.js
          git diff --cached --quiet && exit 0
          git commit -m "Release 2.3.21 skip unavailable video mode"
          git push
