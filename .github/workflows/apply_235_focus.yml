name: Apply 2.3.5 focus isolation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply_235_focus.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focus patch
        run: python tools/PATCH_235_FOCUS.py

      - name: Validate JavaScript and version
        run: |
          node --check background.js
          node --check windowed_fullscreen.js
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          assert m['version']=='2.3.5', m['version']
          bg=Path('background.js').read_text(encoding='utf-8')
          assert 'focusedWindow.focused === false' in bg
          assert 'preferredWindowId !== focusedWindow.id' in bg
          assert 'isCrossInputDuplicate' in bg
          assert '"command"' in bg and '"content"' in bg
          print('VALIDATE_235_FOCUS_OK')
          PY

      - name: Commit 2.3.5
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add background.js manifest.json
          git commit -m 'Release 2.3.5 focus-isolated Alt+C handling'
          git push origin main
