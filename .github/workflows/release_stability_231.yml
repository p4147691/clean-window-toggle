name: Release Clean Window 2.3.1 stability merge

on:
  push:
    branches:
      - main
    paths:
      - 'tools/APPLY_RELEASE_231.py'
      - '.github/workflows/release_stability_231.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 2.3.1 merge
        run: python tools/APPLY_RELEASE_231.py

      - name: Validate JavaScript and invariants
        run: |
          node --check background.js
          node --check windowed_fullscreen.js
          node -e "const m=require('./manifest.json'); if(m.version!=='2.3.1') throw new Error('version');"
          python - <<'PY'
          from pathlib import Path
          bg = Path('background.js').read_text(encoding='utf-8')
          wf = Path('windowed_fullscreen.js').read_text(encoding='utf-8')
          checks = {
            'anchor single-tab only': 'sourceTabs.length !== 1' in bg,
            'anchor stored': 'anchorTabId: anchorTab?.id ?? null' in bg,
            'anchor hidden from shell': '.filter((tab) => tab.id !== session.anchorTabId)' in bg,
            'anchor removed after real return': 'removeSourceAnchorAfterReturn(session.anchorTabId, source.id, tab.id)' in bg,
            'fullscreen pending storage': 'cleanWindowFullscreenPendingV1' in bg,
            'fullscreen materializer': 'materializeFullscreenMode(windowId)' in bg,
            'native fullscreen path': 'window.state === "fullscreen"' in bg,
            'bounds tolerance': 'boundsChanged(bounds, session.popupInitialBounds || session.sourceBounds)' in bg,
            'do not rewrite unchanged return bounds': 'showWindow(source.id, useChangedBounds ? bounds : null, true)' in bg,
            'popup baseline refreshed': 'session.popupInitialBounds = getBounds(newPopup) || bounds' in bg,
            'no forced source reminimize in recover': 'source.state !== "minimized"' not in bg,
            'old safe return retained': 'movePopupTabBack(tab.id, source.id' in bg,
            'explicit gold border': 'clean-window-gold-border' in wf and 'renderGoldBorder(true)' in wf,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
            raise SystemExit('Missing invariants: ' + ', '.join(failed))
          print('Clean Window 2.3.1 invariants OK')
          PY
          git diff --check

      - name: Commit validated merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add background.js manifest.json windowed_fullscreen.js README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Release 2.3.1 merged window stability improvements"
          git push origin HEAD:main
