name: Apply YouTube Nonvideo Route Guard

on:
  push:
    branches:
      - fix/youtube-nonvideo-route-exit-20260903
    paths:
      - '.github/workflows/apply_youtube_route_guard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/youtube-nonvideo-route-exit-20260903
      - name: Apply route guard
        run: python .github/apply_youtube_route_guard.py
      - name: Validate
        run: |
          node --check windowed_fullscreen.js
          git diff --check
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windowed_fullscreen.js
          git commit -m "Exit fullscreen on non-video YouTube routes"
          git push origin HEAD:fix/youtube-nonvideo-route-exit-20260903
