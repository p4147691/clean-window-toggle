name: Validate Clean Window

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript and input routing
        run: |
          node --check background.js
          node --check windowed_fullscreen.js
          node --check fullscreen_guard.js
          node --test tests/*.test.js
      - name: Validate manifest
        run: |
          node -e "const manifest=require('./manifest.json'); if(manifest.manifest_version!==3) throw new Error('expected MV3'); if(!/^\d+\.\d+\.\d+$/.test(manifest.version)) throw new Error('invalid version')"
