<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#18120d"/></linearGradient>
    <linearGradient id="video" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#192846"/><stop offset=".48" stop-color="#9b3e24"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <text x="70" y="92" fill="#fff" font-family="Arial, sans-serif" font-size="44" font-weight="700">YouTube를 작은 창 안에서 풀스크린처럼</text>
  <text x="72" y="137" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="23">Alt+C 한 번으로 주소창과 탭 영역을 정리하고 영상에 집중하세요</text>
  <g filter="url(#shadow)">
    <rect x="74" y="190" width="1132" height="520" rx="16" fill="#121212" stroke="#f59e0b" stroke-width="3"/>
    <path d="M90 190h1100a16 16 0 0 1 16 16v42H74v-42a16 16 0 0 1 16-16z" fill="#262626"/>
    <circle cx="101" cy="219" r="7" fill="#ef4444"/><circle cx="124" cy="219" r="7" fill="#f59e0b"/><circle cx="147" cy="219" r="7" fill="#22c55e"/>
    <text x="177" y="227" fill="#e5e7eb" font-family="Arial, sans-serif" font-size="17">Clean Window Toggle — 작은 창 풀스크린</text>
    <rect x="74" y="248" width="1132" height="462" fill="url(#video)"/>
    <circle cx="640" cy="475" r="54" fill="#000" fill-opacity=".55" stroke="#fff" stroke-width="3"/>
    <path d="M626 443l48 32-48 32z" fill="#fff"/>
    <text x="109" y="665" fill="#fff" font-family="Arial, sans-serif" font-size="29" font-weight="700">작은 창의 크기는 그대로, 영상 영역은 더 넓게</text>
  </g>
  <rect x="905" y="84" width="300" height="72" rx="16" fill="#f59e0b"/>
  <text x="947" y="130" fill="#111827" font-family="Arial, sans-serif" font-size="27" font-weight="700">Alt + C 로 전환</text>
  <text x="75" y="760" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">※ Windows 위쪽 제목 표시줄은 유지됩니다. 운영체제 전체화면이 아닌 Chrome 창 내부 집중 모드입니다.</text>
</svg>
